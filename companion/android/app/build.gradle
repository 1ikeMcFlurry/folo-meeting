plugins { id 'com.android.application' }
android {
    namespace 'com.folotoy.meeting'
    compileSdk 36
    defaultConfig {
        applicationId 'com.folotoy.meeting'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'com.folotoy.meeting.AudioInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Espressif's SDK has diagnostic logs containing provisioning secrets.
    // Optimize both builds so those Android Log calls never reach logcat.
    buildTypes {
        debug {
            // AGP disables log-removing optimizations in debuggable APKs.
            // Keep the debug signing key (in-place install), without SDK logs.
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies {
    implementation 'com.github.espressif:esp-idf-provisioning-android:lib-2.4.4'
    implementation 'org.greenrobot:eventbus:3.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
