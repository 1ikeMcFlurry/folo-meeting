<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>连接AI通行证</title>
<style>
:root{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#192d49;background:#edf3fa;font-synthesis:none;line-height:1.5;--blue:#285fcc;--muted:#65768b;--line:#dbe4ef}
*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:0 auto;padding:32px 22px max(26px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:14px;margin-bottom:28px}.mark{width:54px;height:64px;border-radius:11px;background:#192d49;display:grid;place-items:center;flex-shrink:0}.mark svg{width:32px;stroke:#80cbbd;fill:none;stroke-width:2.5;stroke-linecap:round}h1{font-size:25px;line-height:1.3;letter-spacing:-.6px;margin:0 0 6px;font-weight:650}header p{color:var(--muted);margin:0;font-size:13px}.intro{font-size:15px;margin:0 0 24px;color:#465b76}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}h2{font-size:17px;margin:0;font-weight:650}button,input{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.6;cursor:wait}.link{background:transparent;color:var(--blue);padding:9px 0 9px 12px;font-size:14px}.networks{border:1px solid var(--line);border-radius:15px;background:white;overflow:hidden}.network{width:100%;display:flex;align-items:center;gap:12px;background:white;color:inherit;padding:15px;text-align:left;border-bottom:1px solid #edf1f6;min-height:62px}.network:last-child{border:0}.network[aria-pressed=true]{background:#eef4ff}.network .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:550}.network .meta{font-size:12px;color:var(--muted)}.network .check{color:var(--blue);width:18px;font-size:19px}.signal{display:flex;align-items:end;gap:2px;height:16px;flex-shrink:0}.signal i{width:3px;border-radius:1px;background:#c5cfdb}.signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:9px}.signal i:nth-child(3){height:13px}.signal i.on{background:#496784}.placeholder{padding:24px 18px;font-size:14px;color:var(--muted);text-align:center}.manual{margin:6px 0 19px;text-align:right}.manual button{padding:12px 0}.form{padding-top:4px}label{display:block;font-size:14px;font-weight:550;margin-bottom:8px}.field{margin-bottom:18px}input{width:100%;min-height:50px;padding:12px 14px;color:inherit;background:white;border:1px solid #b9c9dc;border-radius:10px;outline:none;font-size:16px}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #285fcc21}.password{position:relative}.password input{padding-right:68px}.password button{position:absolute;right:3px;top:3px;height:44px;padding:0 13px;background:transparent;color:var(--blue);font-size:14px}.primary{width:100%;min-height:52px;padding:13px 20px;border-radius:11px;background:var(--blue);color:white;font-size:16px;font-weight:600}.primary:active{background:#194cae}.note{margin:15px 0 0;color:var(--muted);font-size:12px;text-align:center}.status{margin:18px 0 0;padding:14px 16px;border-radius:10px;background:#e1ebfa;color:#28466e;font-size:14px;overflow-wrap:anywhere}.status.error{background:#fae8e8;color:#943333}.done{padding:18px 2px}.done .seal{width:62px;height:62px;background:#d4eee6;color:#237a62;border-radius:50%;display:grid;place-items:center;font-size:30px;margin:0 0 22px}.done h2{font-size:26px;margin:0 0 12px}.done p{font-size:15px;color:#465b76;margin:0 0 14px}.done .saved-name{font-weight:600;color:#192d49;overflow-wrap:anywhere}button:focus-visible{outline:3px solid #83a9f1;outline-offset:3px}[hidden]{display:none!important}@media(min-width:600px){main{margin:40px auto;padding:32px 30px;background:#f7faff;border:1px solid var(--line);border-radius:24px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<main>
  <header><div class="mark" aria-hidden="true"><svg viewBox="0 0 32 38"><path d="M6 12c6-6 14-6 20 0M10 17c4-4 8-4 12 0M14 22c1-1 3-1 4 0"/><path d="M16 28v2"/></svg></div><div><h1>连接AI通行证</h1><p id="device">Folo Meeting</p></div></header>
  <div id="setup">
    <p class="intro">为AI通行证选择一个 <strong>2.4 GHz Wi-Fi</strong>。连接成功后，下次开机会自动联网。</p>
    <section aria-labelledby="net-title"><div class="section-title"><h2 id="net-title">附近的 Wi-Fi</h2><button type="button" class="link" id="refresh">重新搜索</button></div><div id="networks" class="networks" aria-live="polite"><div class="placeholder">正在搜索附近的网络…</div></div></section>
    <div class="manual"><button class="link" type="button" id="manual">手动输入网络名称</button></div>
    <form id="form" class="form">
      <div class="field"><label for="ssid">网络名称</label><input id="ssid" name="ssid" required maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="选择上方网络，或直接输入"></div>
      <div class="field"><label for="password">Wi-Fi 密码</label><div class="password"><input id="password" name="password" type="password" maxlength="64" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入该 Wi-Fi 的密码"><button type="button" id="show" aria-label="显示密码">显示</button></div></div>
      <button class="primary" type="submit" id="connect">验证并保存</button>
      <p class="note">密码只发送到这台AI通行证。连接验证通过后才保存。</p>
    </form>
    <p id="status" class="status" role="status" aria-live="polite" hidden></p>
  </div>
  <section id="done" class="done" hidden tabindex="-1"><div class="seal" aria-hidden="true">✓</div><h2>AI通行证已联网</h2><p>已保存 <span id="saved-name" class="saved-name"></span>。设备热点即将关闭，手机可以切回原来的网络。</p><p>设备屏幕会返回待机页。需要更换网络时，长按设备的上键，重新进入配网。</p></section>
</main>
<script>
const $=id=>document.getElementById(id);let token='',submitting=false,selected='',pollTimer=0;
function status(text,error=false){$('status').hidden=false;$('status').textContent=text;$('status').classList.toggle('error',error)}
async function request(path,options={}){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(path,{cache:'no-store',...options,signal:ctl.signal});if(!r.ok)throw new Error('request');return await r.json()}finally{clearTimeout(timer)}}
function locked(value){submitting=value;for(const id of ['refresh','manual','ssid','password','show','connect'])$(id).disabled=value;document.querySelectorAll('.network').forEach(b=>b.disabled=value);$('connect').textContent=value?'正在验证连接…':'验证并保存'}
function complete(){clearTimeout(pollTimer);$('setup').hidden=true;$('done').hidden=false;$('saved-name').textContent=selected||'新的 Wi-Fi';$('password').value='';$('done').focus()}
async function poll(){try{const data=await request('/api/status');token=data.token;$('device').textContent=data.device;if(data.complete){complete();return}if(data.busy){locked(true);status(data.message);pollTimer=setTimeout(poll,1200)}else if(submitting){locked(false);status(data.message,true)}}catch(e){if(submitting){status('设备正在切换网络。请保持连接设备热点，或查看设备屏幕确认结果。');pollTimer=setTimeout(poll,2000)}}}
async function scan(){if(submitting)return;$('refresh').disabled=true;$('networks').replaceChildren();const hint=document.createElement('div');hint.className='placeholder';hint.textContent='正在搜索附近的网络…';$('networks').append(hint);try{const data=await request('/api/networks');$('networks').replaceChildren();if(!data.length){hint.textContent='暂未找到网络。打开路由器或手机热点后重新搜索，也可以手动输入。';$('networks').append(hint)}for(const network of data){const row=document.createElement('button');row.type='button';row.className='network';row.setAttribute('aria-pressed',network.ssid===selected?'true':'false');const bars=document.createElement('span');bars.className='signal';bars.setAttribute('aria-hidden','true');const level=network.signal>-60?3:network.signal>-78?2:1;for(let i=0;i<3;i++){const bar=document.createElement('i');bar.className=i<level?'on':'';bars.append(bar)}const name=document.createElement('span');name.className='name';name.textContent=network.ssid;const meta=document.createElement('span');meta.className='meta';meta.textContent=network.secured?'需密码':'开放';const check=document.createElement('span');check.className='check';check.textContent=network.ssid===selected?'✓':'';row.append(bars,name,meta,check);row.addEventListener('click',()=>{selected=network.ssid;$('ssid').value=selected;document.querySelectorAll('.network').forEach(b=>{b.setAttribute('aria-pressed','false');b.querySelector('.check').textContent='' });row.setAttribute('aria-pressed','true');check.textContent='✓';$('password').value='';$('password').placeholder=network.secured?'输入该 Wi-Fi 的密码':'开放网络可以不填密码';$('password').focus()});$('networks').append(row)}}catch(e){hint.textContent='搜索暂不可用，请重新搜索或手动输入网络名称。';$('networks').replaceChildren(hint)}finally{$('refresh').disabled=submitting}}
$('refresh').addEventListener('click',scan);$('manual').addEventListener('click',()=>$('ssid').focus());$('show').addEventListener('click',()=>{const shown=$('password').type==='password';$('password').type=shown?'text':'password';$('show').textContent=shown?'隐藏':'显示';$('show').setAttribute('aria-label',shown?'隐藏密码':'显示密码')});
$('form').addEventListener('submit',async e=>{e.preventDefault();if(submitting)return;const ssid=$('ssid').value,password=$('password').value;const bytes=new TextEncoder();if(!ssid||bytes.encode(ssid).length>32){status('网络名称需为 1–32 个字节；中文名称最多约 10 个字。',true);return}const n=bytes.encode(password).length;if((n>0&&n<8)||n>64||(n===64&&!/^[0-9a-fA-F]{64}$/.test(password))){status('请检查密码长度：通常为 8–63 个字符。开放网络可留空。',true);return}selected=ssid;locked(true);status('正在验证网络连接，请保持连接设备热点。');try{if(!token){const s=await request('/api/status');token=s.token}await request('/api/config',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':token},body:JSON.stringify({ssid,password})});pollTimer=setTimeout(poll,700)}catch(e){locked(false);status('暂时无法提交。请确认手机仍连接设备热点，然后重试。',true)}});
(async()=>{try{const s=await request('/api/status');token=s.token;$('device').textContent=s.device;if(s.complete){complete();return}if(s.busy){locked(true);poll();return}}catch(e){status('请保持连接设备热点，然后刷新此页。',true)}scan()})();
</script>
</html>
