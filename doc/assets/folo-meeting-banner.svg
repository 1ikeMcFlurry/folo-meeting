    <text x="936" y="89" font-size="15" font-weight="700" fill="#302331">会议纪要</text>
    <rect x="936" y="103" width="68" height="5" rx="2.5" fill="#db2777"/>
    <text x="936" y="140" font-size="11" font-weight="700" fill="#756674">KEY TAKEAWAYS</text>
    <path d="M936 158h167m-167 13h141m-141 13h153" stroke="#e8dbe2" stroke-width="5" stroke-linecap="round"/>
    <rect x="936" y="205" width="171" height="35" rx="8" fill="#fce7f0"/>
